name: Github Actions

on:
  push:
    branches: '**'
jobs:
  code-quality:
    runs-on: macos-latest
    continue-on-error: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up Bun and Node with mise
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        version: 2026.11.0
        install_args: bun node
    - name: Install agent tooling
      run: bun install --frozen-lockfile
    - name: Validate the actual branch name
      if: github.ref_type == 'branch'
      env:
        BRANCH_NAME: ${{ github.ref_name }}
      run: bun run lint:branch-name "$BRANCH_NAME"
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        architecture: 'x64'
    - name: install shellcheck and luacheck
      run: |
        brew install shellcheck
        brew install luacheck
    - name: install and configure python dependencies
      run: pip install -r ./requirements.txt
    - name: Run shared validation
      run: |
        pre-commit install
        bun run check
    - name: Run ansible MacOS
      run: |
        ./runAnsible.sh -e "dotfiles_home=${RUNNER_TEMP}/dotfiles-home ansible_python_interpreter=$(command -v python3)"

  ansible-ubuntu:
    runs-on: ubuntu-24.04
    continue-on-error: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        architecture: 'x64'
    - name: install and configure python dependencies
      run: pip install -r ./requirements.txt
    - name: Run ansible Ubuntu 24.04
      run: |
        ./runAnsible.sh -e "dotfiles_dir=${GITHUB_WORKSPACE} dotfiles_home=${RUNNER_TEMP}/dotfiles-home clone_dotfiles=false ansible_python_interpreter=$(command -v python3)"
