name: Github Actions

on:
  push:
    branches: '**'
jobs:
  code-quality:
    runs-on: macos-latest
    continue-on-error: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up Bun and Node with mise
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        version: 2026.10.17
        install_args: bun node
    - name: Check agent skills
      run: |
        bun install --frozen-lockfile
        bun run agents:check
    - name: Validate the actual branch name
      if: github.event_name == 'pull_request' || github.ref_type == 'branch'
      env:
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      run: bun run lint:branch-name "$BRANCH_NAME"
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        architecture: 'x64'
    - name: install shellcheck and luacheck
      run: |
        brew install shellcheck
        brew install luacheck
    - name: install and configure python dependencies
      run: pip install -r ./requirements.txt
    - name: Run shared validation
      run: |
        pre-commit install
        bun run check
      env:
          SKIP: no-commit-to-branch
    - name: Run ansible MacOS
      run: |
        ./runAnsible.sh -e "dotfiles_home=${RUNNER_TEMP}/dotfiles-home ansible_python_interpreter=$(command -v python3)"

  ansible-ubuntu:
    runs-on: ubuntu-24.04
    continue-on-error: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        architecture: 'x64'
    - name: install and configure python dependencies
      run: pip install -r ./requirements.txt
    - name: Run ansible Ubuntu 24.04
      run: |
        ./runAnsible.sh -e "dotfiles_dir=${GITHUB_WORKSPACE} dotfiles_home=${RUNNER_TEMP}/dotfiles-home clone_dotfiles=false ansible_python_interpreter=$(command -v python3)"
