name: Github Actions

on:
  push:
    branches: '**'
jobs:
  code-quality:
    runs-on: macos-latest
    continue-on-error: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up Bun and Node with mise
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        version: 2026.10.13
        install_args: bun node
    - name: Check agent skills
      run: |
        bun install --frozen-lockfile
        bun run agents:check
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        architecture: 'x64'
    - name: install shellcheck and luacheck
      run: |
        brew install shellcheck
        brew install luacheck
    - name: install and configure python dependencies
      run: pip install -r ./requirements.txt
    - name: Run pre-commit
      run: |
        pre-commit install
        pre-commit run --all-files
      env:
          SKIP: no-commit-to-branch
    - name: Test Ansible preview guards
      run: |
        python3 -m unittest discover -s tests
        bun run test:markdownlint
    - name: Run ansible MacOS
      run: |
        ./runAnsible.sh -e "dotfiles_home=${RUNNER_TEMP}/dotfiles-home ansible_python_interpreter=$(command -v python3)"

  ansible-ubuntu:
    runs-on: ubuntu-24.04
    continue-on-error: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        architecture: 'x64'
    - name: install and configure python dependencies
      run: pip install -r ./requirements.txt
    - name: Run ansible Ubuntu 24.04
      run: |
        ./runAnsible.sh -e "dotfiles_dir=${GITHUB_WORKSPACE} dotfiles_home=${RUNNER_TEMP}/dotfiles-home clone_dotfiles=false ansible_python_interpreter=$(command -v python3)"
