[general]
accounts = gmail
pythonfile = ~/.offlineimap.py

[Account gmail]
localrepository = gmail-local
remoterepository = gmail-remote

[Repository gmail-local]
type = Maildir
localfolders = ~/Mail/gmail
nametrans = lambda folder: re.sub('spam', '[Gmail].Spam',
                           re.sub('drafts', '[Gmail].Drafts',
                           re.sub('sent', '[Gmail].Sent Mail',
                           re.sub('flagged', '[Gmail].Starred',
                           re.sub('trash', '[Gmail].Trash',
                           re.sub('important', '[Gmail].Important',
                           re.sub('archive', '[Gmail].All Mail', folder)))))))

[Repository gmail-remote]
type = Gmail
remoteuser = dansullivan@gmail.com
remotepasseval = os.environ['GMAIL_APP_SPECIFIC_PASSWORD']
nametrans = lambda folder: re.sub('.*Spam$', 'spam',
                           re.sub('.*Drafts$', 'drafts',
                           re.sub('.*Sent Mail$', 'sent',
                           re.sub('.*Starred$', 'flagged',
                           re.sub('.*Trash$', 'trash',
                           re.sub('.*Important$', 'important',
                           re.sub('.*All Mail$', 'archive', folder)))))))

folderfilter = lambda foldername: foldername not in ['[Gmail]/All Mail','[Gmail]/Important','[Gmail]/Spam']

# imaplib2 3.06 looks up legacy TLS constants missing with OpenSSL 4.
remotehost = imap.gmail.com
remoteport = 993
# macOS launchers may have only Apple's LibreSSL on PATH.
transporttunnel = PATH="/opt/homebrew/opt/openssl@3/bin:/usr/local/opt/openssl@3/bin:$PATH" \
                  exec openssl s_client -connect %(remotehost)s:%(remoteport)s -servername %(remotehost)s \
                  -verify_hostname %(remotehost)s -verify_return_error \
                  -min_protocol TLSv1.2 -quiet -nocommands -no_ign_eof
