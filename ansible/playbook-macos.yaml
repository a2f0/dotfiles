---
- name: Configure macOS
  hosts: 127.0.0.1
  connection: local
  become: false
  gather_facts: false
  vars:
    dotfiles_dir: "{{ playbook_dir | dirname }}"
    ansible_python_interpreter: /usr/bin/python3
  pre_tasks:
    - name: Gather host facts without local executable facts
      ansible.builtin.setup:
        fact_path: /dev/null
        gather_subset: ['!facter', '!ohai']
      tags:
        - always
    - name: Ensure this playbook only runs on macOS
      ansible.builtin.fail:
        msg: "This playbook is intended for macOS systems only"
      when: ansible_facts['os_family'] != 'Darwin'
      tags:
        - always
  tasks:
    - name: Import files task
      ansible.builtin.import_tasks: tasks/files.yaml
      tags:
        - files
    - name: Import macos files task
      ansible.builtin.import_tasks: tasks/macos/files.yaml
      tags:
        - files
    - name: Import macos defaults task
      ansible.builtin.import_tasks: tasks/macos/defaults.yaml
      tags:
        - defaults
    - name: Import mcabber task
      ansible.builtin.import_tasks: tasks/mcabber.yaml
      tags:
        - files
    - name: Import weechat task
      ansible.builtin.import_tasks: tasks/weechat.yaml
      tags:
        - files
    - name: Import go task
      ansible.builtin.import_tasks: tasks/go.yaml
      tags:
        - files
  handlers:
    - name: Import macos handlers
      ansible.builtin.import_tasks: handlers/macos.yaml
