---
- name: Configure Ubuntu 24.04 / Linux Mint 22 Linux
  hosts: all
  gather_facts: false
  vars:
    dotfiles_dir: ~/dotfiles
    ansible_python_interpreter: /usr/bin/python3
  pre_tasks:
    - name: Gather host facts without local executable facts
      ansible.builtin.setup:
        fact_path: /dev/null
        gather_subset: ['!facter', '!ohai']
      tags:
        - always
    - name: Ensure this playbook only runs on Ubuntu 24.04 or Linux Mint 22
      ansible.builtin.fail:
        msg: "This playbook is intended for Ubuntu 24.04 or Linux Mint 22 systems only"
      when: >
        not (
          (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] is version('24.04', '==')) or
          (ansible_facts['distribution'] == 'Linux Mint' and ansible_facts['distribution_major_version'] is version('22', '=='))
        )
      tags:
        - always
  tasks:
    - name: Import clone dotfiles task
      ansible.builtin.import_tasks: tasks/clone-dotfiles-into-home.yaml
    - name: Import files task
      ansible.builtin.import_tasks: tasks/files.yaml
      tags:
        - files
    - name: Import mcabber task
      ansible.builtin.import_tasks: tasks/mcabber.yaml
      tags:
        - files
    - name: Import weechat task
      ansible.builtin.import_tasks: tasks/weechat.yaml
      tags:
        - files
