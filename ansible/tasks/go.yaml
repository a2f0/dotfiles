---
- name: Make sure ~/go exists
  ansible.builtin.file:
    path: "{{ dotfiles_home | default(ansible_facts['user_dir']) }}/go"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    mode: "0700"

- name: Make sure ~/go/bin exists
  ansible.builtin.file:
    path: "{{ dotfiles_home | default(ansible_facts['user_dir']) }}/go/bin"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    mode: "0700"
