---
- name: Make sure the Codex directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_home | default(ansible_facts['user_dir']) }}/.codex"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    mode: "0700"

- name: Create the Codex profile symlink
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/codex/dotfiles.config.toml"
    dest: "{{ dotfiles_home | default(ansible_facts['user_dir']) }}/.codex/dotfiles.config.toml"
    state: link
    force: false
    follow: false
